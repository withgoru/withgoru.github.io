media:
  - name: posts_media
    label: Post Bundle Images (content/posts)
    input: content/posts
    output: /posts
    categories: [image]
  - name: static_images
    label: Static Images (static/images)
    input: static/images
    output: /images
    categories: [image]

content:
  - name: posts
    label: 블로그 포스트 (Posts)
    type: collection
    path: content/posts
    format: toml-frontmatter
    filename: "{primary}/index.md"
    subfolders: true
    view:
      fields: [title, date, draft, categories, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목 (Title)
        type: string
        required: true
      - name: description
        label: 요약 설명 (Description)
        type: string
      - name: date
        label: 발행 일시 (Date)
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'+09:00'"
      - name: draft
        label: 초안 여부 (Draft)
        type: boolean
        default: false
      - name: categories
        label: 카테고리 (Categories)
        type: string
        list: true
        default: ["Engineering"]
      - name: tags
        label: 태그 (Tags)
        type: string
        list: true
      - name: ShowToc
        label: 목차 표시 (Show ToC)
        type: boolean
        default: true
      - name: TocOpen
        label: 목차 기본 펼침 (ToC Open)
        type: boolean
        default: true
      - name: cover
        label: 대표 썸네일 (Cover Image)
        type: object
        fields:
          - name: image
            label: 이미지 경로 (Image)
            type: image
            options:
              media: posts_media
          - name: alt
            label: 대체 텍스트 (Alt Text)
            type: string
          - name: caption
            label: 캡션 (Caption)
            type: string
          - name: relative
            label: Page Bundle 상대 경로 여부 (Relative)
            type: boolean
            default: true
      - name: body
        label: 본문 (Content)
        type: rich-text
        options:
          media: posts_media

  - name: about
    label: 소개 (About)
    type: file
    path: content/about.md
    format: toml-frontmatter
    fields:
      - name: title
        label: 제목 (Title)
        type: string
        required: true
      - name: date
        label: 최종 수정일 (Date)
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'+09:00'"
      - name: url
        label: 고정 경로 (URL)
        type: string
        default: "/about/"
      - name: layout
        label: 레이아웃 (Layout)
        type: string
        default: "profile"
      - name: summary
        label: 요약 (Summary)
        type: string
      - name: body
        label: 본문 마크다운 (Markdown Content)
        type: code
        options:
          language: markdown
