<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Git 커밋 객체 그래프와 브랜치 포인터 및 Fast-forward vs 3-Way Merge 비교</title>
  <desc id="diagram-desc">상단은 Commit, Tree, Blob 객체 그래프와 부모 커밋 체인 위에서 41바이트 파일인 브랜치 포인터와 HEAD가 동작하는 구조를 보여주며, 하단은 Fast-forward 병합과 3-Way Merge의 동작 차이를 비교한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .panel-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }

      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: middle; }
      .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-anchor: middle; }
      .mono-left { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-anchor: start; }
      .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; text-anchor: middle; }

      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .node-commit { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; rx: 6; }
      .node-tree { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; rx: 6; }
      .node-blob { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; rx: 6; }
      .node-base { fill: #fef3c7; stroke: #d97706; stroke-width: 1.6; rx: 6; }
      .node-merge { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.7; rx: 6; }

      .badge-head { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 5; }
      .badge-branch { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 5; }
      .badge-branch-alt { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 5; }
      .badge-faded { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 2; rx: 5; }
      .pill-note { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 6; }

      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
      .txt-blue { fill: #0369a1; }
      .txt-purple { fill: #6d28d9; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-red { fill: #b91c1c; }

      .arrow-slate { stroke: #475569; stroke-width: 1.5; fill: none; }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; }
      .arrow-purple { stroke: #7c3aed; stroke-width: 1.5; fill: none; }
      .arrow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; }
      .arrow-green { stroke: #16a34a; stroke-width: 1.6; fill: none; }
      .arrow-green-dash { stroke: #16a34a; stroke-width: 1.7; stroke-dasharray: 5 3; fill: none; }
    </style>

    <marker id="head-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="head-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="1" y="1" width="818" height="538" rx="12" class="bg" />

  <!-- ==================== SECTION 1: OBJECT GRAPH AND BRANCH POINTERS ==================== -->
  <text x="26" y="30" class="section-title">1. Git 커밋 객체 그래프와 브랜치 / HEAD 포인터 구조 (Pro Git 3.1)</text>

  <!-- Left Panel: Commit -> Tree -> Blob (5 Objects) -->
  <rect x="24" y="44" width="322" height="206" class="panel-card" />
  <text x="38" y="64" class="panel-title">단일 커밋의 스냅샷: 5개의 객체 생성</text>

  <!-- Commit 98ca9 -->
  <rect x="38" y="78" width="106" height="56" class="node-commit" />
  <text x="91" y="97" class="box-title txt-blue">Commit</text>
  <text x="91" y="113" class="mono-title txt-blue">98ca9</text>
  <text x="91" y="127" class="sub-txt txt-slate">author, meta</text>

  <!-- Arrow Commit -> Tree -->
  <line x1="144" y1="106" x2="188" y2="106" class="arrow-purple" marker-end="url(#head-purple)" />
  <text x="166" y="99" class="edge-label txt-purple">tree</text>

  <!-- Tree 92ec2 -->
  <rect x="192" y="74" width="138" height="66" class="node-tree" />
  <text x="261" y="91" class="box-title txt-purple">Tree (92ec2)</text>
  <text x="202" y="106" class="mono-left txt-slate">blob 3b18e README</text>
  <text x="202" y="119" class="mono-left txt-slate">blob 911e7 test.rb</text>
  <text x="202" y="132" class="mono-left txt-slate">blob cba0a LICENSE</text>

  <!-- Connectors Tree -> 3 Blobs -->
  <line x1="261" y1="140" x2="261" y2="160" class="arrow-slate" />
  <line x1="81" y1="160" x2="291" y2="160" class="arrow-slate" />
  <line x1="81" y1="160" x2="81" y2="180" class="arrow-slate" marker-end="url(#head-slate)" />
  <line x1="186" y1="160" x2="186" y2="180" class="arrow-slate" marker-end="url(#head-slate)" />
  <line x1="291" y1="160" x2="291" y2="180" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- 3 Blobs -->
  <rect x="38" y="184" width="86" height="50" class="node-blob" />
  <text x="81" y="202" class="box-title txt-slate">Blob</text>
  <text x="81" y="216" class="mono-sub txt-muted">3b18e</text>
  <text x="81" y="229" class="mono-sub txt-slate">README</text>

  <rect x="143" y="184" width="86" height="50" class="node-blob" />
  <text x="186" y="202" class="box-title txt-slate">Blob</text>
  <text x="186" y="216" class="mono-sub txt-muted">911e7</text>
  <text x="186" y="229" class="mono-sub txt-slate">test.rb</text>

  <rect x="248" y="184" width="86" height="50" class="node-blob" />
  <text x="291" y="202" class="box-title txt-slate">Blob</text>
  <text x="291" y="216" class="mono-sub txt-muted">cba0a</text>
  <text x="291" y="229" class="mono-sub txt-slate">LICENSE</text>

  <!-- Right Panel: Parent Chain + Branch Divergence + HEAD -->
  <rect x="360" y="44" width="436" height="206" class="panel-card" />
  <text x="374" y="64" class="panel-title">부모 커밋 체인과 브랜치 분기 (HEAD -> master)</text>

  <!-- HEAD and master badges -->
  <rect x="582" y="76" width="60" height="24" class="badge-head" />
  <text x="612" y="92" class="mono-title txt-red">HEAD</text>
  <line x1="642" y1="88" x2="682" y2="88" class="arrow-red" marker-end="url(#head-red)" />

  <rect x="686" y="76" width="86" height="24" class="badge-branch" />
  <text x="729" y="92" class="mono-title txt-green">master</text>
  <line x1="729" y1="100" x2="729" y2="114" class="arrow-green" marker-end="url(#head-green)" />

  <!-- Commit Chain: 98ca9 <- 34ac2 <- f30ab -->
  <rect x="376" y="142" width="66" height="38" class="node-commit" />
  <text x="409" y="159" class="mono-title txt-blue">98ca9</text>
  <text x="409" y="173" class="sub-txt txt-slate">Initial</text>

  <rect x="464" y="142" width="66" height="38" class="node-commit" />
  <text x="497" y="159" class="mono-title txt-blue">34ac2</text>
  <text x="497" y="173" class="sub-txt txt-slate">Fix #1328</text>
  <line x1="464" y1="161" x2="446" y2="161" class="arrow-slate" marker-end="url(#head-slate)" />

  <rect x="552" y="142" width="66" height="38" class="node-commit" />
  <text x="585" y="159" class="mono-title txt-blue">f30ab</text>
  <text x="585" y="173" class="sub-txt txt-slate">Feat #32</text>
  <line x1="552" y1="161" x2="534" y2="161" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- Diverged top commit: c2b9e (master) -->
  <rect x="682" y="118" width="94" height="36" class="node-commit" />
  <text x="729" y="135" class="mono-title txt-blue">c2b9e</text>
  <text x="729" y="148" class="sub-txt txt-slate">other changes</text>
  <line x1="682" y1="136" x2="622" y2="155" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- Diverged bottom commit: 87ab2 (testing) -->
  <rect x="682" y="170" width="94" height="36" class="node-commit" />
  <text x="729" y="187" class="mono-title txt-blue">87ab2</text>
  <text x="729" y="200" class="sub-txt txt-slate">Make a change</text>
  <line x1="682" y1="188" x2="622" y2="168" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- testing branch badge below 87ab2 -->
  <rect x="686" y="218" width="86" height="24" class="badge-branch-alt" />
  <text x="729" y="234" class="mono-title txt-amber">testing</text>
  <line x1="729" y1="218" x2="729" y2="209" stroke="#d97706" stroke-width="1.6" marker-end="url(#head-amber)" />

  <!-- 41-byte pill note -->
  <rect x="376" y="206" width="286" height="28" class="pill-note" />
  <text x="519" y="224" class="sub-txt txt-slate" style="font-weight: 600;">브랜치 = 40자 SHA-1 해시 + 개행 = 41바이트 파일</text>

  <!-- Divider -->
  <line x1="24" y1="266" x2="796" y2="266" class="divider" />

  <!-- ==================== SECTION 2: FAST-FORWARD vs 3-WAY MERGE ==================== -->
  <text x="26" y="294" class="section-title">2. 병합 메커니즘 비교: Fast-forward Merge vs 3-Way Merge (Pro Git 3.2)</text>

  <!-- Left Panel: Fast-forward Merge -->
  <rect x="24" y="310" width="376" height="214" class="panel-card" />
  <text x="38" y="330" class="panel-title">A. Fast-forward Merge (git merge hotfix)</text>
  <text x="212" y="347" class="panel-sub">C2가 C4의 직계 조상이므로 병합 커밋 없이 포인터만 전진한다</text>

  <!-- hotfix badge above C4 -->
  <rect x="275" y="362" width="76" height="22" class="badge-branch-alt" />
  <text x="313" y="377" class="mono-title txt-amber">hotfix</text>
  <line x1="313" y1="384" x2="313" y2="395" stroke="#d97706" stroke-width="1.5" marker-end="url(#head-amber)" />

  <!-- Commits C1 <- C2 <- C4 -->
  <rect x="46" y="398" width="64" height="38" class="node-commit" />
  <text x="78" y="421" class="mono-title txt-blue">C1</text>

  <rect x="148" y="398" width="64" height="38" class="node-base" />
  <text x="180" y="416" class="mono-title txt-amber">C2</text>
  <text x="180" y="430" class="mono-sub txt-amber">f42c576</text>
  <line x1="148" y1="417" x2="114" y2="417" class="arrow-slate" marker-end="url(#head-slate)" />

  <rect x="281" y="398" width="64" height="38" class="node-commit" />
  <text x="313" y="416" class="mono-title txt-blue">C4</text>
  <text x="313" y="430" class="mono-sub txt-blue">3a0874c</text>
  <line x1="281" y1="417" x2="216" y2="417" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- master Before -> After -->
  <rect x="134" y="454" width="92" height="24" class="badge-faded" />
  <text x="180" y="470" class="mono-sub txt-muted">master (기존)</text>
  <line x1="180" y1="454" x2="180" y2="440" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#head-slate)" />

  <rect x="264" y="454" width="98" height="24" class="badge-branch" />
  <text x="313" y="470" class="mono-sub txt-green" style="font-weight: 700;">master (이동 후)</text>
  <line x1="313" y1="454" x2="313" y2="440" class="arrow-green" marker-end="url(#head-green)" />

  <!-- Curved arrow for Fast-forward pointer move -->
  <path d="M 180 478 Q 246 508 308 480" class="arrow-green-dash" marker-end="url(#head-green)" />
  <text x="246" y="512" class="edge-label txt-green">Fast-forward (포인터만 이동)</text>

  <!-- Right Panel: 3-Way Merge -->
  <rect x="416" y="310" width="380" height="214" class="panel-card" />
  <text x="430" y="330" class="panel-title">B. 3-Way Merge (git merge iss53)</text>
  <text x="606" y="347" class="panel-sub">공통 조상(C2)과 양쪽 브랜치 끝(C4, C5)을 합쳐 Merge Commit 생성</text>

  <!-- C2 Common Ancestor -->
  <rect x="432" y="396" width="66" height="44" class="node-base" />
  <text x="465" y="415" class="mono-title txt-amber">C2</text>
  <text x="465" y="431" class="sub-txt txt-amber">공통 조상</text>

  <!-- C4 (master before) -->
  <rect x="536" y="360" width="70" height="38" class="node-commit" />
  <text x="571" y="377" class="mono-title txt-blue">C4</text>
  <text x="571" y="391" class="mono-sub txt-slate">hotfix 병합</text>
  <line x1="536" y1="379" x2="500" y2="408" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- C3 and C5 (iss53) -->
  <rect x="518" y="446" width="52" height="36" class="node-commit" />
  <text x="544" y="468" class="mono-title txt-blue">C3</text>
  <line x1="518" y1="464" x2="498" y2="432" class="arrow-slate" marker-end="url(#head-slate)" />

  <rect x="592" y="446" width="76" height="36" class="node-commit" />
  <text x="630" y="462" class="mono-title txt-blue">C5</text>
  <text x="630" y="476" class="mono-sub txt-slate">ad82d7a</text>
  <line x1="592" y1="464" x2="574" y2="464" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- iss53 pointer -->
  <rect x="596" y="494" width="68" height="22" class="badge-branch-alt" />
  <text x="630" y="509" class="mono-title txt-amber">iss53</text>
  <line x1="630" y1="494" x2="630" y2="485" stroke="#d97706" stroke-width="1.5" marker-end="url(#head-amber)" />

  <!-- Merge Commit C6 (Two Parents) -->
  <rect x="698" y="392" width="84" height="48" class="node-merge" />
  <text x="740" y="413" class="mono-title txt-green">C6</text>
  <text x="740" y="429" class="sub-txt txt-green">부모 2개 (C4,C5)</text>

  <!-- Two Parent Arrows from C6 -->
  <line x1="698" y1="406" x2="610" y2="380" class="arrow-green" marker-end="url(#head-green)" />
  <line x1="698" y1="426" x2="671" y2="460" class="arrow-green" marker-end="url(#head-green)" />

  <!-- master pointer above C6 -->
  <rect x="706" y="356" width="68" height="22" class="badge-branch" />
  <text x="740" y="371" class="mono-title txt-green">master</text>
  <line x1="740" y1="378" x2="740" y2="389" class="arrow-green" marker-end="url(#head-green)" />

  <!-- 3-Way label under C2 -->
  <rect x="428" y="490" width="136" height="24" class="pill-note" />
  <text x="496" y="506" class="sub-txt txt-slate" style="font-weight: 600;">3개 스냅샷(C2, C4, C5) 대조</text>
</svg>
