<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">cherry-pick 커밋 이식, rerere 충돌 재사용, 그리고 git describe 빌드 식별자 해부</title>
  <desc id="diagram-desc">상단은 git cherry-pick으로 topic 브랜치의 단일 커밋 델타만 master에 이식하는 과정과 git rerere의 pre-image/post-image 자동 해결 흐름을 보여주고, 하단은 git describe 출력 문자열 v1.6.2-rc1-20-g2414721의 4요소 분해와 릴리즈 패키징 도구 체인을 정리한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .pill-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.1; rx: 6; }
      .pill-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.1; rx: 6; }
      .pill-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.1; rx: 6; }
      .pill-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.1; rx: 6; }
      .pill-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.1; rx: 6; }

      .seg-blue { fill: #0284c7; rx: 6; }
      .seg-amber { fill: #d97706; rx: 6; }
      .seg-slate { fill: #475569; rx: 6; }
      .seg-green { fill: #16a34a; rx: 6; }

      .c-slate { fill: #64748b; stroke: #334155; stroke-width: 2; }
      .c-blue { fill: #0284c7; stroke: #0369a1; stroke-width: 2; }
      .c-amber { fill: #f59e0b; stroke: #b45309; stroke-width: 2.2; }
      .c-green { fill: #22c55e; stroke: #15803d; stroke-width: 2.2; }

      .flow-blue { stroke: #0284c7; stroke-width: 2.2; fill: none; }
      .flow-slate { stroke: #64748b; stroke-width: 2; fill: none; }
      .flow-cherry { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
      .conn-blue { stroke: #0284c7; stroke-width: 1.5; fill: none; }
      .conn-amber { stroke: #d97706; stroke-width: 1.5; fill: none; }
      .conn-slate { stroke: #475569; stroke-width: 1.5; fill: none; }
      .conn-green { stroke: #16a34a; stroke-width: 1.5; fill: none; }

      .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mono-left { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .seg-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
      .sub-left { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: start; }
      .c-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }

      .txt-blue { fill: #0369a1; }
      .txt-red { fill: #b91c1c; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="818" height="538" rx="12" class="bg" />

  <!-- SECTION 1: CHERRY-PICK AND RERERE -->
  <text x="26" y="34" class="section-title">1. git cherry-pick 핀셋 커밋 이식과 git rerere 반복 충돌 자동 해결</text>

  <!-- Left Panel: cherry-pick -->
  <rect x="24" y="46" width="392" height="214" class="panel-card" />
  <text x="38" y="66" class="panel-title">A. git cherry-pick e43a6fd (단일 델타 이식)</text>

  <!-- Edges -->
  <line x1="66" y1="118" x2="120" y2="118" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="146" y1="118" x2="226" y2="118" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="252" y1="118" x2="332" y2="118" class="flow-blue" marker-end="url(#arr-blue)" />

  <path d="M 140 128 L 178 184" class="flow-slate" marker-end="url(#arr-slate)" />
  <line x1="196" y1="194" x2="234" y2="194" class="flow-slate" marker-end="url(#arr-slate)" />
  <line x1="260" y1="194" x2="314" y2="194" class="flow-slate" marker-end="url(#arr-slate)" />

  <!-- cherry-pick arc -->
  <path d="M 256 184 L 336 130" class="flow-cherry" marker-end="url(#arr-red)" />

  <!-- Nodes -->
  <circle cx="62" cy="118" r="12" class="c-blue" />
  <text x="62" y="122" class="c-txt">C1</text>

  <circle cx="134" cy="118" r="12" class="c-blue" />
  <text x="134" y="122" class="c-txt">C2</text>

  <circle cx="240" cy="118" r="12" class="c-blue" />
  <text x="240" y="122" class="c-txt">C5</text>

  <circle cx="348" cy="118" r="13" class="c-green" />
  <text x="348" y="122" class="c-txt">C4'</text>

  <circle cx="184" cy="194" r="12" class="c-slate" />
  <text x="184" y="198" class="c-txt">C3</text>

  <circle cx="248" cy="194" r="13" class="c-amber" />
  <text x="248" y="198" class="c-txt">C4</text>

  <circle cx="328" cy="194" r="12" class="c-slate" />
  <text x="328" y="198" class="c-txt">C6</text>

  <!-- Labels -->
  <text x="348" y="96" class="mono-sm txt-green">master (a1b2c3d)</text>
  <text x="248" y="218" class="mono-sm txt-amber">topic (e43a6fd)</text>
  <text x="288" y="166" class="sub-left txt-red" style="font-weight:700;">C3→C4 델타만 적용</text>

  <rect x="38" y="226" width="364" height="24" class="pill-green" />
  <text x="220" y="242" class="sub-txt txt-slate">C3 · C6 미포함 / 스냅샷 같지만 부모 변경으로 새 해시 C4' 생성</text>

  <!-- Right Panel: rerere -->
  <rect x="430" y="46" width="366" height="214" class="panel-card" />
  <text x="444" y="66" class="panel-title">B. git rerere (.git/rr-cache 자동 기억)</text>

  <rect x="444" y="76" width="338" height="47" class="pill-red" />
  <text x="454" y="93" class="mono-left txt-red">1. Pre-image 기록 (충돌 발생 직후)</text>
  <text x="454" y="110" class="sub-left txt-slate">양쪽 충돌 블록의 해시 지문을 .git/rr-cache에 자동 저장</text>

  <rect x="444" y="131" width="338" height="47" class="pill-blue" />
  <text x="454" y="148" class="mono-left txt-blue">2. Post-image 기록 (개발자 해결 후 커밋)</text>
  <text x="454" y="165" class="sub-left txt-slate">충돌을 고치고 커밋하면 지문에 대응하는 정답 결과 저장</text>

  <rect x="444" y="186" width="338" height="47" class="pill-green" />
  <text x="454" y="203" class="mono-left txt-green">3. 자동 재적용 (재병합 · Rebase 전환 시)</text>
  <text x="454" y="220" class="sub-left txt-slate">같은 충돌이 다시 뜨면 저장해 둔 정답으로 즉시 자동 해결</text>

  <text x="613" y="251" class="mono-sm txt-muted">git config --global rerere.enabled true 로 활성화</text>

  <!-- Divider -->
  <line x1="24" y1="274" x2="796" y2="274" class="divider" />

  <!-- SECTION 2: GIT DESCRIBE AND RELEASE -->
  <text x="26" y="302" class="section-title">2. git describe 빌드 식별자 해부 (v1.6.2-rc1-20-g2414721) 및 릴리즈 패키징</text>

  <!-- Left Panel: git describe anatomy -->
  <rect x="24" y="314" width="478" height="210" class="panel-card" />
  <text x="38" y="334" class="panel-title">A. git describe 출력 구조 (사람이 읽을 수 있는 스냅샷 ID)</text>

  <!-- Big segmented string -->
  <rect x="42" y="350" width="142" height="36" class="seg-blue" />
  <text x="113" y="373" class="seg-txt">v1.6.2-rc1</text>

  <text x="192" y="373" class="mono-label txt-slate" style="font-size:16px;">-</text>

  <rect x="200" y="350" width="56" height="36" class="seg-amber" />
  <text x="228" y="373" class="seg-txt">20</text>

  <text x="264" y="373" class="mono-label txt-slate" style="font-size:16px;">-</text>

  <rect x="272" y="350" width="44" height="36" class="seg-slate" />
  <text x="294" y="373" class="seg-txt">g</text>

  <rect x="324" y="350" width="158" height="36" class="seg-green" />
  <text x="403" y="373" class="seg-txt">2414721</text>

  <!-- Callout connector lines inside clear central lane -->
  <line x1="113" y1="386" x2="113" y2="408" class="conn-blue" />
  <line x1="403" y1="386" x2="403" y2="408" class="conn-green" />
  <line x1="228" y1="386" x2="228" y2="464" class="conn-amber" />
  <line x1="294" y1="386" x2="294" y2="464" class="conn-slate" />

  <!-- Top boxes (outer) -->
  <rect x="42" y="408" width="146" height="46" class="pill-blue" />
  <text x="115" y="426" class="mono-sm txt-blue">1. 최근접 Annotated 태그</text>
  <text x="115" y="443" class="sub-txt txt-slate">(--tags 옵션 시 경량 포함)</text>

  <rect x="338" y="408" width="144" height="46" class="pill-green" />
  <text x="410" y="426" class="mono-sm txt-green">4. HEAD 축약 SHA-1 해시</text>
  <text x="410" y="443" class="sub-txt txt-slate">(앞 7자리 해시 접미사)</text>

  <!-- Bottom boxes -->
  <rect x="42" y="464" width="212" height="46" class="pill-amber" />
  <text x="148" y="482" class="mono-sm txt-amber">2. 태그 이후 경과 커밋 수 (20개)</text>
  <text x="148" y="499" class="sub-txt txt-slate">(태그 정위치 체크아웃 시 숫자 생략)</text>

  <rect x="270" y="464" width="212" height="46" class="pill-slate" />
  <text x="376" y="482" class="mono-sm txt-slate">3. 접두사 'g' = Git (도구 식별)</text>
  <text x="376" y="499" class="sub-txt txt-slate">(--dirty 지정 시 로컬 변경 유무 표기)</text>

  <!-- Right Panel: Release Packaging -->
  <rect x="516" y="314" width="280" height="210" class="panel-card" />
  <text x="530" y="334" class="panel-title">B. 릴리즈 서명 · 요약 · 아카이브</text>

  <rect x="530" y="348" width="252" height="48" class="pill-blue" />
  <text x="540" y="366" class="mono-left txt-blue">git tag -s v1.5 -m "my signed tag"</text>
  <text x="540" y="384" class="sub-left txt-slate">GPG / SSH 서명으로 배포 무결성 보장</text>

  <rect x="530" y="406" width="252" height="48" class="pill-amber" />
  <text x="540" y="424" class="mono-left txt-amber">git shortlog --no-merges v1.0..</text>
  <text x="540" y="442" class="sub-left txt-slate">기여자별 커밋 묶어 릴리즈 노트 요약</text>

  <rect x="530" y="464" width="252" height="48" class="pill-green" />
  <text x="540" y="482" class="mono-left txt-green">git archive master --format=tar.gz</text>
  <text x="540" y="500" class="sub-left txt-slate">.git 제외한 순수 배포 소스 아카이브</text>
</svg>
