<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Git 원격 저장소 동기화와 태그 내부 객체 구조</title>
  <desc id="diagram-desc">상단은 git fetch, git pull, git push 시 원격 저장소와 로컬 .git 디렉토리 및 워킹 트리 간의 동기화 범위를 보여주며, 하단은 Annotated 태그와 Lightweight 태그의 내부 객체 참조 구조 차이를 나타낸다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .section-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #475569; }

      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; text-anchor: middle; }
      .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-weight: 700; text-anchor: middle; }

      .panel-remote { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .panel-git { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .panel-work { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 8; }

      .pill-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; rx: 6; }
      .pill-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .pill-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
      .pill-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 6; }

      .txt-slate { fill: #334155; }
      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }

      .arrow-green { stroke: #16a34a; stroke-width: 1.7; fill: none; }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.7; fill: none; }
      .arrow-amber { stroke: #d97706; stroke-width: 1.6; fill: none; }
      .arrow-gray { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
      .arrow-pull { stroke: #7c3aed; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
    </style>

    <marker id="head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="head-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="head-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="1" y="1" width="818" height="478" rx="12" class="bg" />

  <!-- ==================== SECTION 1: REMOTE SYNC ==================== -->
  <text x="32" y="32" class="section-title">1. 원격 저장소 동기화: git fetch vs git pull / git push</text>

  <!-- git pull overarching arc -->
  <path d="M 126 74 C 126 38, 694 38, 694 70" class="arrow-pull" marker-end="url(#head-purple)" />
  <rect x="235" y="34" width="350" height="20" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1" />
  <text x="410" y="48" class="edge-label" style="fill: #6d28d9; font-size: 11px;">git pull = git fetch + merge (또는 rebase)</text>

  <!-- Panel 1: Remote (origin) -->
  <rect x="36" y="76" width="180" height="148" class="panel-remote" />
  <text x="126" y="96" class="box-title txt-slate">Remote (origin)</text>
  <rect x="50" y="108" width="152" height="46" class="pill-blue" />
  <text x="126" y="128" class="mono-title txt-blue">master</text>
  <text x="126" y="144" class="mono-sub txt-blue">refs/heads/master</text>
  <text x="126" y="196" class="sub-txt txt-slate">원격 저장소 (GitHub 등)</text>

  <!-- Panel 2: Local .git Directory -->
  <rect x="290" y="70" width="240" height="162" class="panel-git" />
  <text x="410" y="90" class="box-title txt-blue">Local .git Directory</text>

  <rect x="308" y="102" width="204" height="46" class="pill-green" />
  <text x="410" y="122" class="mono-title txt-green">origin/master</text>
  <text x="410" y="138" class="mono-sub txt-green">refs/remotes/origin/master</text>

  <rect x="308" y="174" width="204" height="46" class="pill-blue" />
  <text x="410" y="194" class="mono-title txt-blue">master</text>
  <text x="410" y="210" class="mono-sub txt-blue">refs/heads/master</text>

  <!-- Vertical merge/rebase arrow inside .git -->
  <line x1="410" y1="148" x2="410" y2="170" class="arrow-amber" marker-end="url(#head-amber)" />
  <text x="466" y="164" class="mono-sub txt-amber" style="font-weight: 700;">merge/rebase</text>

  <!-- Panel 3: Working Tree -->
  <rect x="604" y="76" width="180" height="148" class="panel-work" />
  <text x="694" y="142" class="box-title txt-amber">Working Tree</text>
  <text x="694" y="162" class="sub-txt txt-amber">현재 체크아웃된 파일</text>

  <!-- Horizontal arrows between Remote and Local -->
  <line x1="202" y1="125" x2="304" y2="125" class="arrow-green" marker-end="url(#head-green)" />
  <text x="253" y="116" class="edge-label txt-green">git fetch</text>

  <line x1="308" y1="197" x2="220" y2="197" class="arrow-blue" marker-end="url(#head-blue)" />
  <text x="253" y="188" class="edge-label txt-blue">git push</text>

  <!-- Horizontal arrow between Local master and Working Tree -->
  <line x1="512" y1="197" x2="600" y2="197" class="arrow-amber" marker-end="url(#head-amber)" />
  <text x="567" y="188" class="edge-label txt-amber" style="font-size: 10.5px;">update</text>

  <!-- Divider -->
  <line x1="28" y1="252" x2="792" y2="252" class="divider" />

  <!-- ==================== SECTION 2: TAG OBJECTS ==================== -->
  <text x="32" y="284" class="section-title">2. 태그 내부 객체 구조: Annotated vs Lightweight</text>
  <text x="32" y="304" class="section-sub">Annotated 태그는 .git DB에 독립된 태그 객체를 생성하고, Lightweight 태그는 커밋 체크섬만 가리키는 포인터다.</text>

  <!-- Shared Commit Object (Right) -->
  <rect x="594" y="324" width="190" height="122" class="pill-blue" />
  <text x="689" y="348" class="box-title txt-blue">Commit Object</text>
  <text x="689" y="368" class="mono-title txt-blue">ca82a6d</text>
  <text x="689" y="392" class="mono-sub txt-slate">Author: Scott Chacon</text>
  <text x="689" y="408" class="mono-sub txt-slate">Date: Mon Mar 17 2008</text>
  <text x="689" y="426" class="sub-txt txt-slate">Change version number</text>

  <!-- Row 1: Annotated Tag -->
  <rect x="36" y="324" width="166" height="52" class="pill-green" />
  <text x="119" y="346" class="mono-title txt-green">v1.4</text>
  <text x="119" y="364" class="sub-txt txt-green">Annotated Tag (-a)</text>

  <line x1="202" y1="350" x2="256" y2="350" class="arrow-green" marker-end="url(#head-green)" />

  <rect x="260" y="316" width="270" height="72" class="pill-amber" />
  <text x="395" y="338" class="box-title txt-amber">Tag Object (독립 객체)</text>
  <text x="395" y="356" class="mono-sub txt-amber">Tagger: Ben Straub / Date / Message</text>
  <text x="395" y="373" class="sub-txt txt-amber">자체 체크섬 보유 및 GPG 서명 가능</text>

  <line x1="530" y1="350" x2="590" y2="350" class="arrow-amber" marker-end="url(#head-amber)" />

  <!-- Row 2: Lightweight Tag -->
  <rect x="36" y="402" width="166" height="52" class="pill-gray" />
  <text x="119" y="424" class="mono-title txt-slate">v1.4-lw</text>
  <text x="119" y="442" class="sub-txt txt-slate">Lightweight Tag</text>

  <line x1="202" y1="428" x2="590" y2="416" class="arrow-gray" marker-end="url(#head-gray)" />
  <rect x="284" y="406" width="222" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="395" y="421" class="sub-txt txt-slate" style="font-weight: 600;">커밋 해시(ca82a6d)만 직접 가리키는 포인터</text>
</svg>
