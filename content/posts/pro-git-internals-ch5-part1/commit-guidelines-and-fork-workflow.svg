<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Atomic Commit, 50/72 및 Conventional Commits 1.0.0과 이중 리모트 Topic 브랜치 격리</title>
  <desc id="diagram-desc">상단은 git diff --check, git add -p 논리 분리, 50/72 및 Conventional Commits v1.0.0 커밋 규율과 SemVer 매핑을 정리하고, 하단은 공개 Fork 프로젝트에서 origin과 myfork 이중 리모트를 두고 featureA 리베이스와 featureBv2 squash 통합을 수행하는 흐름을 보여준다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: middle; }
      .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-anchor: middle; }
      .mono-left { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; text-anchor: start; }
      .sub-left { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: start; }

      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .pill-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 6; }
      .pill-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.2; rx: 6; }
      .pill-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 4 2; rx: 6; }
      .pill-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }
      .pill-note { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 6; }

      .node-master { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.4; rx: 5; }
      .node-rebase { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 5; }
      .node-old { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 2; rx: 5; }
      .node-squash { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 5; }

      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-red { fill: #b91c1c; }

      .arrow-slate { stroke: #475569; stroke-width: 1.4; fill: none; }
      .arrow-muted { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 4 2; fill: none; }
      .arrow-green { stroke: #16a34a; stroke-width: 1.5; fill: none; }
      .arrow-green-dash { stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; }
      .arrow-amber { stroke: #d97706; stroke-width: 1.5; fill: none; }
    </style>

    <marker id="head-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="head-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="head-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="1" y="1" width="818" height="538" rx="12" class="bg" />

  <!-- SECTION 1: COMMIT GUIDELINES, 50/72 AND CONVENTIONAL COMMITS -->
  <text x="26" y="30" class="section-title">1. 기여자의 커밋 규율: Atomic Commit · 50/72 · Conventional Commits (v1.0.0)</text>

  <!-- Left Panel: 3 Checklists -->
  <rect x="24" y="44" width="344" height="208" class="panel-card" />
  <text x="38" y="64" class="panel-title">A. 커밋 전 3가지 핵심 체크리스트</text>

  <rect x="38" y="76" width="316" height="48" class="pill-blue" />
  <text x="48" y="95" class="mono-left txt-blue">1. git diff --check</text>
  <text x="48" y="113" class="sub-left txt-slate">후행 공백(Trailing Whitespace) 등 노이즈 사전 탐지</text>

  <rect x="38" y="132" width="316" height="52" class="pill-green" />
  <text x="48" y="151" class="mono-left txt-green">2. 논리적 최소 단위 (Atomic Commit)</text>
  <text x="48" y="169" class="sub-left txt-slate">한 파일 내 다른 이슈는 git add --patch(-p)로 분리</text>

  <rect x="38" y="192" width="316" height="48" class="pill-amber" />
  <text x="48" y="211" class="mono-left txt-amber">3. 명령형 현재 시제 (Imperative Mood)</text>
  <text x="48" y="229" class="sub-left txt-slate">"Fixed bug"(X) → "Fix bug"(O) · git revert 스타일 일치</text>

  <!-- Right Panel: 50/72 Template and Conventional Commits -->
  <rect x="384" y="44" width="412" height="208" class="panel-card" />
  <text x="398" y="64" class="panel-title">B. 50/72 템플릿과 Conventional Commits 1.0.0</text>

  <rect x="398" y="74" width="384" height="40" class="pill-green" />
  <text x="408" y="90" class="mono-left txt-green">1행 (50자): type[scope][!]: description</text>
  <text x="408" y="106" class="sub-left txt-slate">명령형 요약 · 50자 이내 (예: feat(auth): add token refresh)</text>

  <rect x="398" y="119" width="384" height="24" class="pill-red" />
  <text x="590" y="135" class="sub-txt txt-red" style="font-weight: 700;">2행 (필수 빈 줄): 제목과 본문 분리 (rebase · log 정상 파싱)</text>

  <rect x="398" y="148" width="384" height="44" class="pill-blue" />
  <text x="408" y="164" class="mono-left txt-blue">3행~ (72자 본문 + Git 푸터):</text>
  <text x="408" y="182" class="sub-left txt-slate">Why 중심 본문 서술 · 빈 줄 후 Refs: #123 / BREAKING CHANGE:</text>

  <rect x="398" y="197" width="112" height="43" class="pill-blue" />
  <text x="454" y="215" class="mono-title txt-blue">fix: ...</text>
  <text x="454" y="232" class="sub-txt txt-slate">SemVer PATCH (Z)</text>

  <rect x="518" y="197" width="112" height="43" class="pill-green" />
  <text x="574" y="215" class="mono-title txt-green">feat: ...</text>
  <text x="574" y="232" class="sub-txt txt-slate">SemVer MINOR (Y)</text>

  <rect x="638" y="197" width="144" height="43" class="pill-amber" />
  <text x="710" y="215" class="mono-sub txt-amber" style="font-weight: 700;">! / BREAKING CHANGE:</text>
  <text x="710" y="232" class="sub-txt txt-slate">SemVer MAJOR (X)</text>

  <!-- Divider -->
  <line x1="24" y1="268" x2="796" y2="268" class="divider" />

  <!-- SECTION 2: FORK DUAL REMOTE AND TOPIC ISOLATION -->
  <text x="26" y="296" class="section-title">2. 공개 프로젝트(Fork) 이중 리모트와 독립 Topic 브랜치 격리 운용</text>

  <!-- Left Panel: Dual Remote Roles -->
  <rect x="24" y="312" width="260" height="214" class="panel-card" />
  <text x="38" y="332" class="panel-title">이중 리모트와 브랜치 원칙</text>

  <rect x="38" y="346" width="232" height="52" class="pill-blue" />
  <text x="154" y="365" class="mono-title txt-blue">origin (공식 저장소 · Read)</text>
  <text x="154" y="384" class="sub-txt txt-slate">master는 항상 origin/master만 추적</text>

  <rect x="38" y="406" width="232" height="52" class="pill-amber" />
  <text x="154" y="425" class="mono-title txt-amber">myfork (내 공개 Fork · Write)</text>
  <text x="154" y="444" class="sub-txt txt-slate">master 아닌 Topic 브랜치만 푸시</text>

  <rect x="38" y="466" width="232" height="48" class="pill-note" />
  <text x="154" y="485" class="mono-title txt-slate">PR · git request-pull</text>
  <text x="154" y="502" class="sub-txt txt-muted">(고대 이메일 format-patch의 웹 진화)</text>

  <!-- Right Panel: Forked Topic Branch Rebasing and Squashing -->
  <rect x="298" y="312" width="498" height="214" class="panel-card" />
  <text x="312" y="332" class="panel-title">Topic별 패치 격리 대응: featureA (Rebase) 및 featureBv2 (Squash)</text>

  <!-- Top track: featureA old (dashed) vs rebased onto origin/master -->
  <rect x="366" y="346" width="52" height="26" class="node-old" />
  <text x="392" y="363" class="mono-sub txt-muted">A1 (구)</text>
  <rect x="434" y="346" width="52" height="26" class="node-old" />
  <text x="460" y="363" class="mono-sub txt-muted">A2 (구)</text>
  <line x1="434" y1="359" x2="422" y2="359" class="arrow-muted" marker-end="url(#head-muted)" />

  <!-- Rebased featureA on M3 -->
  <rect x="556" y="346" width="48" height="26" class="node-rebase" />
  <text x="580" y="363" class="mono-title txt-green">A1'</text>
  <rect x="618" y="346" width="48" height="26" class="node-rebase" />
  <text x="642" y="363" class="mono-title txt-green">A2'</text>
  <line x1="618" y1="359" x2="608" y2="359" class="arrow-green" marker-end="url(#head-green)" />

  <rect x="680" y="348" width="104" height="22" class="pill-green" />
  <text x="732" y="363" class="mono-sub txt-green" style="font-weight: 700;">push -f featureA</text>
  <line x1="680" y1="359" x2="670" y2="359" class="arrow-green" marker-end="url(#head-green)" />

  <!-- Main track: origin/master M1 <- M2 <- M3 -->
  <rect x="312" y="394" width="44" height="28" class="node-master" />
  <text x="334" y="412" class="mono-title txt-blue">M1</text>

  <rect x="392" y="394" width="44" height="28" class="node-master" />
  <text x="414" y="412" class="mono-title txt-blue">M2</text>
  <line x1="392" y1="408" x2="360" y2="408" class="arrow-slate" marker-end="url(#head-slate)" />

  <rect x="472" y="394" width="114" height="28" class="node-master" />
  <text x="529" y="412" class="mono-title txt-blue">M3 origin/master</text>
  <line x1="472" y1="408" x2="440" y2="408" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- Connectors for featureA -->
  <line x1="366" y1="368" x2="344" y2="391" class="arrow-muted" marker-end="url(#head-muted)" />
  <line x1="556" y1="368" x2="534" y2="391" class="arrow-green" marker-end="url(#head-green)" />

  <!-- Bottom track: featureB -> squashed featureBv2 on M3 -->
  <rect x="408" y="446" width="48" height="26" class="node-old" />
  <text x="432" y="463" class="mono-sub txt-muted">B1 (구)</text>
  <rect x="470" y="446" width="48" height="26" class="node-old" />
  <text x="494" y="463" class="mono-sub txt-muted">B2 (구)</text>
  <line x1="470" y1="459" x2="460" y2="459" class="arrow-muted" marker-end="url(#head-muted)" />
  <line x1="408" y1="448" x2="412" y2="425" class="arrow-muted" marker-end="url(#head-muted)" />

  <!-- featureBv2 squashed commit on M3 -->
  <rect x="562" y="446" width="82" height="26" class="node-squash" />
  <text x="603" y="463" class="mono-sub txt-amber" style="font-weight: 700;">S1 (--squash)</text>
  <line x1="562" y1="448" x2="540" y2="425" class="arrow-amber" marker-end="url(#head-amber)" />

  <rect x="658" y="448" width="126" height="22" class="pill-amber" />
  <text x="721" y="463" class="mono-sub txt-amber" style="font-weight: 700;">push myfork featureBv2</text>
  <line x1="658" y1="459" x2="648" y2="459" class="arrow-amber" marker-end="url(#head-amber)" />

  <!-- Bottom explanation -->
  <rect x="312" y="488" width="472" height="28" class="pill-note" />
  <text x="548" y="506" class="sub-txt txt-slate" style="font-weight: 600;">서로 다른 토픽을 독립 브랜치로 격리해 한쪽의 Rebase·Squash가 다른 PR에 영향 없음</text>
</svg>
