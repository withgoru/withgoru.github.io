<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Trunk-Based Development 구조와 7대 브랜칭 전략 선택 가이드</title>
  <desc id="diagram-desc">상단은 단일 main(trunk)에 하루 수차례 초단기 브랜치를 통합하고 Feature Flag로 배포와 출시를 분리하는 Trunk-Based Development를 보여주고, 하단은 팀 규모와 배포 주기에 따른 Forking, GitFlow, Release Branching, GitLab Flow, GitHub Flow/TBD 선택 기준 매트릭스를 정리한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .lane-line { stroke: #e2e8f0; stroke-width: 2; }
      .badge-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.2; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }
      .badge-indigo { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.2; rx: 6; }
      .badge-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 6; }

      .pill-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.1; rx: 6; }
      .pill-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.1; rx: 6; }
      .pill-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.1; rx: 6; }
      .pill-note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }

      .c-blue { fill: #0284c7; stroke: #0369a1; stroke-width: 2; }
      .c-green { fill: #22c55e; stroke: #15803d; stroke-width: 2; }

      .flow-blue { stroke: #0284c7; stroke-width: 2.3; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2; fill: none; }
      .flow-slate { stroke: #475569; stroke-width: 1.6; fill: none; }

      .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mono-left { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
      .sub-left { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: start; }
      .row-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; text-anchor: start; }

      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-indigo { fill: #4338ca; }
      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
      .txt-dark { fill: #0f172a; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="818" height="558" rx="12" class="bg" />

  <!-- SECTION 1: TRUNK-BASED DEVELOPMENT -->
  <text x="26" y="34" class="section-title">1. Trunk-Based Development (TBD): 초단기 브랜치 통합과 Feature Flag 분리</text>

  <!-- Left Panel: Rapid Trunk Integration -->
  <rect x="24" y="46" width="504" height="194" class="panel-card" />
  <rect x="148" y="58" width="364" height="24" class="pill-blue" />
  <text x="330" y="74" class="mono-label txt-blue">초고속 CI 빌드 + 자동 테스트 게이트 (하루 수차례 병합)</text>

  <line x1="148" y1="114" x2="514" y2="114" class="lane-line" />
  <line x1="148" y1="168" x2="514" y2="168" class="lane-line" />

  <rect x="38" y="98" width="100" height="32" class="badge-blue" />
  <text x="88" y="112" class="mono-label txt-blue">main (trunk)</text>
  <text x="88" y="125" class="sub-txt txt-slate">유일한 통합 중심</text>

  <rect x="38" y="152" width="100" height="32" class="badge-green" />
  <text x="88" y="166" class="mono-label txt-green">초단기 브랜치</text>
  <text x="88" y="179" class="sub-txt txt-slate">수명 1일 이내 유지</text>

  <!-- Trunk line -->
  <line x1="164" y1="114" x2="220" y2="114" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="230" y1="114" x2="288" y2="114" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="298" y1="114" x2="360" y2="114" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="370" y1="114" x2="430" y2="114" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="440" y1="114" x2="494" y2="114" class="flow-blue" marker-end="url(#arr-blue)" />

  <!-- Tiny branch 1 -->
  <path d="M 168 122 L 196 160" class="flow-green" />
  <path d="M 200 160 L 226 124" class="flow-green" marker-end="url(#arr-green)" />

  <!-- Tiny branch 2 -->
  <path d="M 302 122 L 332 160" class="flow-green" />
  <path d="M 336 160 L 366 124" class="flow-green" marker-end="url(#arr-green)" />

  <!-- Commits -->
  <circle cx="164" cy="114" r="8" class="c-blue" />
  <circle cx="230" cy="114" r="8" class="c-blue" />
  <circle cx="298" cy="114" r="8" class="c-blue" />
  <circle cx="370" cy="114" r="8" class="c-blue" />
  <circle cx="440" cy="114" r="8" class="c-blue" />
  <circle cx="498" cy="114" r="8" class="c-blue" />

  <circle cx="198" cy="168" r="7.5" class="c-green" />
  <circle cx="334" cy="168" r="7.5" class="c-green" />

  <text x="198" y="191" class="sub-txt txt-green">작은 PR (몇 시간 내 병합)</text>
  <text x="334" y="191" class="sub-txt txt-green">직접 커밋 또는 당일 병합</text>

  <rect x="38" y="204" width="474" height="24" class="pill-note" />
  <text x="275" y="220" class="sub-txt txt-slate">장기 브랜치 부재 → 거대 병합 충돌(Merge Hell) 원천 방지 + 지속적 통합 실현</text>

  <!-- Right Panel: Feature Flag Separation -->
  <rect x="542" y="46" width="254" height="194" class="panel-card" />
  <text x="556" y="66" class="panel-title">배포(Deploy) vs 출시(Release) 분리</text>

  <rect x="556" y="78" width="226" height="54" class="pill-amber" />
  <text x="669" y="95" class="mono-label txt-amber">1. Feature Flag: OFF 배포</text>
  <text x="669" y="111" class="sub-txt txt-slate">미완성 기능도 main에 작게 병합 · 배포</text>
  <text x="669" y="125" class="sub-txt txt-muted">(실제 사용자 화면에는 비노출)</text>

  <line x1="669" y1="132" x2="669" y2="148" class="flow-slate" marker-end="url(#arr-slate)" />

  <rect x="556" y="150" width="226" height="54" class="pill-green" />
  <text x="669" y="167" class="mono-label txt-green">2. Feature Flag: ON 전환 출시</text>
  <text x="669" y="183" class="sub-txt txt-slate">재배포 없이 런타임 토글로 점진 오픈</text>
  <text x="669" y="197" class="sub-txt txt-muted">(이상 시 1초 만에 Flag OFF 롤백)</text>

  <text x="669" y="224" class="sub-txt txt-slate">핵심 조건: 탄탄한 테스트 커버리지 + 런타임 제어</text>

  <!-- Divider -->
  <line x1="24" y1="254" x2="796" y2="254" class="divider" />

  <!-- SECTION 2: DECISION MATRIX -->
  <text x="26" y="282" class="section-title">2. 팀 규모 · 배포 주기 · 아키텍처에 따른 브랜칭 전략 선택 가이드</text>

  <!-- Row Headers -->
  <text x="34" y="302" class="mono-left txt-muted">조직 · 배포 상황</text>
  <text x="380" y="302" class="mono-label txt-muted">권장 전략</text>
  <text x="480" y="302" class="mono-left txt-muted">선택 근거 및 Pro Git 3장 핵심 운영 포인트</text>

  <!-- Row 1: Forking Workflow -->
  <rect x="24" y="310" width="772" height="42" class="panel-card" />
  <text x="36" y="328" class="row-title txt-dark">오픈소스 · 외부 기여자 협업</text>
  <text x="36" y="343" class="sub-left txt-muted">공식 저장소 직접 Push 권한 제한 필요</text>
  <rect x="294" y="317" width="172" height="28" class="badge-slate" />
  <text x="380" y="335" class="mono-label txt-slate">Forking Workflow</text>
  <text x="480" y="328" class="sub-left txt-slate">origin/myfork 이중 리모트 · 메인테이너 PR 검토 게이트</text>
  <text x="480" y="343" class="sub-left txt-muted">PR 전 rebase 정리 후 Push (Pro Git 3.6 + 5.2 연동)</text>

  <!-- Row 2: GitFlow -->
  <rect x="24" y="358" width="772" height="42" class="panel-card" />
  <text x="36" y="376" class="row-title txt-dark">정기 릴리즈 · 앱 스토어 · 공식 QA</text>
  <text x="36" y="391" class="sub-left txt-muted">배포 전 코드 동결 · 엄격한 검수 게이트 필수</text>
  <rect x="294" y="365" width="172" height="28" class="badge-indigo" />
  <text x="380" y="383" class="mono-label txt-indigo">GitFlow</text>
  <text x="480" y="376" class="sub-left txt-slate">develop/release/hotfix 분리로 안정화 중 차기 개발 병행</text>
  <text x="480" y="391" class="sub-left txt-muted">소규모 CD 팀은 오버헤드 주의 (Long-Running 확장형)</text>

  <!-- Row 3: Release Branching -->
  <rect x="24" y="406" width="772" height="42" class="panel-card" />
  <text x="36" y="424" class="row-title txt-dark">다중 버전(LTS) · SDK · 온프레미스</text>
  <text x="36" y="439" class="sub-left txt-muted">과거 버전(v1.x/v2.x) 동시 패치 지원 필요</text>
  <rect x="294" y="413" width="172" height="28" class="badge-amber" />
  <text x="380" y="431" class="mono-label txt-amber">Release Branching</text>
  <text x="480" y="424" class="sub-left txt-slate">release/1.x · 2.x 브랜치 유지 + git cherry-pick 백포팅</text>
  <text x="480" y="439" class="sub-left txt-muted">신규 기능 유입 없이 보안 · 치명 버그만 선별 이식 가능</text>

  <!-- Row 4: GitLab Flow / Environment -->
  <rect x="24" y="454" width="772" height="42" class="panel-card" />
  <text x="36" y="472" class="row-title txt-dark">다중 서버 환경 · 승인 기반 단계 배포</text>
  <text x="36" y="487" class="sub-left txt-muted">Dev → Staging → Prod 환경별 상태 분리 필요</text>
  <rect x="294" y="461" width="172" height="28" class="badge-blue" />
  <text x="380" y="479" class="mono-label txt-blue">GitLab Flow</text>
  <text x="480" y="472" class="sub-left txt-slate">환경별 브랜치 승격 + Upstream-First 버그 전파 준수</text>
  <text x="480" y="487" class="sub-left txt-muted">main에서 시작해 하류 환경으로만 내려보내 회귀 차단</text>

  <!-- Row 5: GitHub Flow / TBD -->
  <rect x="24" y="502" width="772" height="44" class="panel-card" />
  <text x="36" y="520" class="row-title txt-dark">웹 · SaaS 상시 배포(CD) · 고성숙 CI</text>
  <text x="36" y="535" class="sub-left txt-muted">단일 운영 환경 · 하루 수회 빠른 배포 목표</text>
  <rect x="294" y="509" width="172" height="28" class="badge-green" />
  <text x="380" y="527" class="mono-label txt-green">GitHub Flow / TBD</text>
  <text x="480" y="520" class="sub-left txt-slate">단일 main + Topic(Feature) 브랜치 초단기 통합 유지</text>
  <text x="480" y="535" class="sub-left txt-muted">자동 CI + Feature Flag 결합 시 DORA 최상위 속도 달성</text>
</svg>
