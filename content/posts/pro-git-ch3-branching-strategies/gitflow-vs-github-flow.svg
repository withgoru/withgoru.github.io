<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">GitFlow와 GitHub Flow 브랜칭 전략 비교</title>
  <desc id="diagram-desc">상단은 main, hotfix, release, develop, feature 5개 브랜치로 구성된 GitFlow의 분기 및 이중 병합 흐름을 보여주고, 하단은 단일 main과 단기 feature 브랜치를 통한 GitHub Flow의 상시 배포 파이프라인과 선택 기준을 비교한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .lane-line { stroke: #e2e8f0; stroke-width: 2; }
      .lane-badge-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.2; rx: 6; }
      .lane-badge-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; rx: 6; }
      .lane-badge-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }
      .lane-badge-indigo { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.2; rx: 6; }
      .lane-badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 6; }

      .tag-pill { fill: #0369a1; rx: 4; }
      .note-pill-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1; rx: 5; }
      .note-pill-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1; rx: 5; }
      .note-pill-indigo { fill: #eef2ff; stroke: #6366f1; stroke-width: 1; rx: 5; }

      .c-blue { fill: #0284c7; stroke: #0369a1; stroke-width: 2; }
      .c-red { fill: #ef4444; stroke: #b91c1c; stroke-width: 2; }
      .c-amber { fill: #f59e0b; stroke: #b45309; stroke-width: 2; }
      .c-indigo { fill: #6366f1; stroke: #4338ca; stroke-width: 2; }
      .c-green { fill: #22c55e; stroke: #15803d; stroke-width: 2; }

      .flow-blue { stroke: #0284c7; stroke-width: 2.2; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2; fill: none; }
      .flow-indigo { stroke: #4f46e5; stroke-width: 2.2; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2; fill: none; }
      .flow-dash-red { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 4 2; fill: none; }
      .flow-dash-amber { stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 4 2; fill: none; }

      .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
      .tag-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }

      .txt-blue { fill: #0369a1; }
      .txt-red { fill: #b91c1c; }
      .txt-amber { fill: #b45309; }
      .txt-indigo { fill: #4338ca; }
      .txt-green { fill: #15803d; }
      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="818" height="558" rx="12" class="bg" />

  <!-- SECTION 1: GITFLOW -->
  <text x="26" y="34" class="section-title">1. GitFlow: 5종 브랜치 트랙과 엄격한 릴리즈 사이클 (Release-Centric)</text>
  <rect x="24" y="46" width="772" height="260" class="panel-card" />

  <!-- Track horizontal guides -->
  <line x1="154" y1="88" x2="778" y2="88" class="lane-line" />
  <line x1="154" y1="134" x2="778" y2="134" class="lane-line" />
  <line x1="154" y1="180" x2="778" y2="180" class="lane-line" />
  <line x1="154" y1="232" x2="778" y2="232" class="lane-line" />
  <line x1="154" y1="278" x2="778" y2="278" class="lane-line" />

  <!-- Lane Badges (Left) -->
  <rect x="38" y="72" width="106" height="32" class="lane-badge-blue" />
  <text x="91" y="86" class="mono-label txt-blue">main</text>
  <text x="91" y="99" class="sub-txt txt-slate">운영 배포 (Tag)</text>

  <rect x="38" y="118" width="106" height="32" class="lane-badge-red" />
  <text x="91" y="132" class="mono-label txt-red">hotfix/*</text>
  <text x="91" y="145" class="sub-txt txt-slate">긴급 장애 패치</text>

  <rect x="38" y="164" width="106" height="32" class="lane-badge-amber" />
  <text x="91" y="178" class="mono-label txt-amber">release/*</text>
  <text x="91" y="191" class="sub-txt txt-slate">릴리즈 QA 안정화</text>

  <rect x="38" y="216" width="106" height="32" class="lane-badge-indigo" />
  <text x="91" y="230" class="mono-label txt-indigo">develop</text>
  <text x="91" y="243" class="sub-txt txt-slate">다음 버전 통합</text>

  <rect x="38" y="262" width="106" height="32" class="lane-badge-green" />
  <text x="91" y="276" class="mono-label txt-green">feature/*</text>
  <text x="91" y="289" class="sub-txt txt-slate">신규 기능 격리</text>

  <!-- GitFlow Paths -->
  <!-- main stream -->
  <line x1="186" y1="88" x2="374" y2="88" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="386" y1="88" x2="658" y2="88" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="670" y1="88" x2="758" y2="88" class="flow-blue" />

  <!-- develop stream -->
  <line x1="186" y1="232" x2="238" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="250" y1="232" x2="334" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="346" y1="232" x2="374" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="386" y1="232" x2="438" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="450" y1="232" x2="540" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="552" y1="232" x2="658" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="670" y1="232" x2="736" y2="232" class="flow-indigo" marker-end="url(#arr-indigo)" />

  <!-- initial branch main -> develop -->
  <path d="M 186 98 L 186 220" class="flow-indigo" marker-end="url(#arr-indigo)" />

  <!-- hotfix path -->
  <path d="M 194 94 L 244 134 L 274 134" class="flow-red" marker-end="url(#arr-red)" />
  <path d="M 296 134 L 336 134 L 378 96" class="flow-red" marker-end="url(#arr-red)" />
  <path d="M 294 142 L 380 222" class="flow-dash-red" marker-end="url(#arr-red)" />

  <!-- feature 1 path -->
  <path d="M 194 240 L 222 278 L 240 278" class="flow-green" marker-end="url(#arr-green)" />
  <line x1="252" y1="278" x2="294" y2="278" class="flow-green" marker-end="url(#arr-green)" />
  <path d="M 314 274 L 341 242" class="flow-green" marker-end="url(#arr-green)" />

  <!-- feature 2 path -->
  <path d="M 396 240 L 434 278 L 458 278" class="flow-green" marker-end="url(#arr-green)" />
  <path d="M 478 278 L 516 278 L 546 242" class="flow-green" marker-end="url(#arr-green)" />

  <!-- release path -->
  <path d="M 458 224 L 494 180 L 504 180" class="flow-amber" marker-end="url(#arr-amber)" />
  <line x1="516" y1="180" x2="580" y2="180" class="flow-amber" marker-end="url(#arr-amber)" />
  <path d="M 600 174 L 664 98" class="flow-amber" marker-end="url(#arr-amber)" />
  <path d="M 600 186 L 662 224" class="flow-dash-amber" marker-end="url(#arr-amber)" />

  <!-- Commit Nodes -->
  <!-- main -->
  <circle cx="186" cy="88" r="9" class="c-blue" />
  <rect x="162" y="54" width="48" height="17" class="tag-pill" />
  <text x="186" y="66" class="tag-txt">v1.0.0</text>

  <circle cx="386" cy="88" r="9" class="c-blue" />
  <rect x="362" y="54" width="48" height="17" class="tag-pill" />
  <text x="386" y="66" class="tag-txt">v1.0.1</text>

  <circle cx="670" cy="88" r="9" class="c-blue" />
  <rect x="646" y="54" width="48" height="17" class="tag-pill" />
  <text x="670" y="66" class="tag-txt">v1.1.0</text>

  <!-- hotfix -->
  <circle cx="286" cy="134" r="8" class="c-red" />
  <text x="286" y="121" class="mono-sm txt-red">HF1</text>
  <rect x="360" y="120" width="110" height="18" class="note-pill-amber" style="fill:#fef2f2;stroke:#ef4444;" />
  <text x="415" y="132" class="sub-txt txt-red">main + develop 병합</text>

  <!-- release -->
  <circle cx="514" cy="180" r="8" class="c-amber" />
  <circle cx="592" cy="180" r="8" class="c-amber" />
  <rect x="492" y="148" width="116" height="18" class="note-pill-amber" />
  <text x="550" y="160" class="sub-txt txt-amber">QA 검증 · 버그 수정</text>
  <rect x="676" y="148" width="110" height="18" class="note-pill-amber" />
  <text x="731" y="160" class="sub-txt txt-amber">main + develop 병합</text>

  <!-- develop -->
  <circle cx="186" cy="232" r="8" class="c-indigo" />
  <circle cx="250" cy="232" r="8" class="c-indigo" />
  <circle cx="346" cy="232" r="8" class="c-indigo" />
  <circle cx="386" cy="232" r="8" class="c-indigo" />
  <circle cx="450" cy="232" r="8" class="c-indigo" />
  <circle cx="552" cy="232" r="8" class="c-indigo" />
  <circle cx="670" cy="232" r="8" class="c-indigo" />
  <circle cx="748" cy="232" r="8" class="c-indigo" />

  <!-- feature -->
  <circle cx="250" cy="278" r="7.5" class="c-green" />
  <circle cx="304" cy="278" r="7.5" class="c-green" />
  <circle cx="468" cy="278" r="7.5" class="c-green" />
  <text x="380" y="297" class="sub-txt txt-green">--no-ff 병합 (기능 이력 보존)</text>
  <text x="664" y="297" class="sub-txt txt-muted">release 종료 후 feature 개발 계속</text>

  <!-- Divider -->
  <line x1="24" y1="320" x2="796" y2="320" class="divider" />

  <!-- SECTION 2: GITHUB FLOW AND CONTRAST -->
  <text x="26" y="344" class="section-title">2. GitHub Flow: 단일 main 중심의 상시 배포 파이프라인 (Continuous Delivery)</text>

  <!-- Left Panel: GitHub Flow Topology -->
  <rect x="24" y="356" width="540" height="190" class="panel-card" />
  <text x="38" y="376" class="panel-title">단일 장기 브랜치 + PR 중심 4단계 루프</text>

  <line x1="146" y1="414" x2="544" y2="414" class="lane-line" />
  <line x1="146" y1="476" x2="544" y2="476" class="lane-line" />

  <rect x="38" y="398" width="98" height="32" class="lane-badge-blue" />
  <text x="87" y="412" class="mono-label txt-blue">main</text>
  <text x="87" y="425" class="sub-txt txt-slate">항상 배포 가능</text>

  <rect x="38" y="460" width="98" height="32" class="lane-badge-green" />
  <text x="87" y="474" class="mono-label txt-green">feature/*</text>
  <text x="87" y="487" class="sub-txt txt-slate">단기 작업 단위</text>

  <!-- GitHub Flow arrows and nodes -->
  <line x1="170" y1="414" x2="438" y2="414" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="450" y1="414" x2="516" y2="414" class="flow-blue" marker-end="url(#arr-blue)" />

  <path d="M 176 422 L 210 476 L 222 476" class="flow-green" marker-end="url(#arr-green)" />
  <line x1="234" y1="476" x2="288" y2="476" class="flow-green" marker-end="url(#arr-green)" />
  <path d="M 426 476 L 444 426" class="flow-green" marker-end="url(#arr-green)" />

  <circle cx="170" cy="414" r="9" class="c-blue" />
  <circle cx="232" cy="476" r="8" class="c-green" />
  <circle cx="300" cy="476" r="8" class="c-green" />

  <rect x="322" y="462" width="106" height="28" class="note-pill-green" />
  <text x="375" y="475" class="mono-sm txt-green">PR + CI 테스트</text>
  <text x="375" y="486" class="sub-txt txt-slate">리뷰 후 승인</text>

  <circle cx="450" cy="414" r="9" class="c-blue" />
  <rect x="408" y="382" width="84" height="19" class="tag-pill" style="fill:#15803d;" />
  <text x="450" y="395" class="tag-txt">즉시 CD 배포</text>
  <circle cx="528" cy="414" r="9" class="c-blue" />

  <rect x="38" y="510" width="512" height="24" class="note-pill-indigo" style="fill:#f8fafc;stroke:#cbd5e1;" />
  <text x="294" y="526" class="sub-txt txt-slate">1. main 분기  →  2. 작은 커밋 · 푸시  →  3. PR 코드 리뷰 · 자동 테스트  →  4. 병합 즉시 운영 배포</text>

  <!-- Right Panel: Selection Contrast -->
  <rect x="578" y="356" width="218" height="190" class="panel-card" />
  <text x="592" y="376" class="panel-title">두 전략의 결정적 분기점</text>

  <rect x="592" y="388" width="190" height="68" class="note-pill-indigo" />
  <text x="687" y="406" class="mono-label txt-indigo">GitFlow 적합 상황</text>
  <text x="687" y="424" class="sub-txt txt-slate">정기 배포 일정 · 앱 스토어 심사</text>
  <text x="687" y="440" class="sub-txt txt-muted">명시적 QA 동결 + 긴급 핫픽스 트랙</text>

  <rect x="592" y="466" width="190" height="68" class="note-pill-green" />
  <text x="687" y="484" class="mono-label txt-green">GitHub Flow 적합 상황</text>
  <text x="687" y="502" class="sub-txt txt-slate">단일 운영 버전 · 웹/SaaS CD</text>
  <text x="687" y="518" class="sub-txt txt-muted">작은 배포 단위 + 빠른 피드백 우선</text>
</svg>
