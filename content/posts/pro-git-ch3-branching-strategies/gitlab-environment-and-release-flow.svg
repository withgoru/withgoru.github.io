<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">GitLab Flow(Environment Branching)와 Release Branching 구조 비교</title>
  <desc id="diagram-desc">상단은 feature에서 main, staging, production으로 승격하는 GitLab Flow 및 Environment Branching의 Upstream-First 버그 수정 전파 흐름을 보여주고, 하단은 main에서 release/1.0과 release/2.0을 분기해 git cherry-pick으로 보안 패치를 백포팅하는 Release Branching을 보여준다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .lane-line { stroke: #e2e8f0; stroke-width: 2; }
      .badge-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 6; }
      .badge-blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.2; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }
      .badge-indigo { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.2; rx: 6; }
      .badge-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; rx: 6; }
      .badge-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 6; }

      .pill-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.1; rx: 6; }
      .pill-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.1; rx: 6; }
      .pill-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.1; rx: 6; }
      .pill-note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }

      .c-green { fill: #22c55e; stroke: #15803d; stroke-width: 2; }
      .c-blue { fill: #0284c7; stroke: #0369a1; stroke-width: 2; }
      .c-amber { fill: #f59e0b; stroke: #b45309; stroke-width: 2; }
      .c-indigo { fill: #6366f1; stroke: #4338ca; stroke-width: 2; }
      .c-red { fill: #ef4444; stroke: #b91c1c; stroke-width: 2.2; }
      .c-slate { fill: #64748b; stroke: #334155; stroke-width: 2; }

      .flow-blue { stroke: #0284c7; stroke-width: 2.2; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2; fill: none; }
      .flow-indigo { stroke: #4f46e5; stroke-width: 2; fill: none; }
      .flow-slate { stroke: #64748b; stroke-width: 2; fill: none; }
      .flow-red-dash { stroke: #dc2626; stroke-width: 1.9; stroke-dasharray: 5 3; fill: none; }
      .flow-cherry { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }

      .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
      .tag-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }

      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-indigo { fill: #4338ca; }
      .txt-red { fill: #b91c1c; }
      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="818" height="538" rx="12" class="bg" />

  <!-- SECTION 1: GITLAB FLOW / ENVIRONMENT BRANCHING -->
  <text x="26" y="34" class="section-title">1. GitLab Flow / Environment Branching: 환경별 승격과 Upstream-First 원칙</text>

  <!-- Left Diagram Card -->
  <rect x="24" y="46" width="526" height="224" class="panel-card" />

  <line x1="146" y1="78" x2="536" y2="78" class="lane-line" />
  <line x1="146" y1="126" x2="536" y2="126" class="lane-line" />
  <line x1="146" y1="176" x2="536" y2="176" class="lane-line" />
  <line x1="146" y1="228" x2="536" y2="228" class="lane-line" />

  <!-- Lane Badges -->
  <rect x="36" y="64" width="100" height="28" class="badge-green" />
  <text x="86" y="82" class="mono-label txt-green">feature/*</text>

  <rect x="36" y="112" width="100" height="28" class="badge-blue" />
  <text x="86" y="130" class="mono-label txt-blue">main</text>

  <rect x="36" y="162" width="100" height="28" class="badge-amber" />
  <text x="86" y="180" class="mono-label txt-amber">staging</text>

  <rect x="36" y="214" width="100" height="28" class="badge-indigo" />
  <text x="86" y="232" class="mono-label txt-indigo">production</text>

  <!-- Upstream-First rule box in upper-right empty space -->
  <rect x="296" y="56" width="240" height="38" class="pill-red" />
  <text x="416" y="72" class="mono-sm txt-red">Upstream-First 원칙 (핫픽스 규칙)</text>
  <text x="416" y="86" class="sub-txt txt-slate">production 직접 수정 금지 → main 수정 후 하류 전파</text>

  <!-- Flows -->
  <!-- main horizontal -->
  <line x1="168" y1="126" x2="246" y2="126" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="258" y1="126" x2="360" y2="126" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="372" y1="126" x2="508" y2="126" class="flow-blue" marker-end="url(#arr-blue)" />

  <!-- staging horizontal -->
  <line x1="302" y1="176" x2="406" y2="176" class="flow-amber" marker-end="url(#arr-amber)" />
  <line x1="418" y1="176" x2="508" y2="176" class="flow-amber" marker-end="url(#arr-amber)" />

  <!-- production horizontal -->
  <line x1="348" y1="228" x2="454" y2="228" class="flow-indigo" marker-end="url(#arr-indigo)" />
  <line x1="466" y1="228" x2="516" y2="228" class="flow-indigo" />

  <!-- feature -> main -->
  <path d="M 174 118 L 196 78 L 208 78" class="flow-green" marker-end="url(#arr-green)" />
  <path d="M 226 78 L 252 116" class="flow-green" marker-end="url(#arr-green)" />

  <!-- promotion M2 -> staging S1 -> prod P1 -->
  <path d="M 264 134 L 296 168" class="flow-amber" marker-end="url(#arr-amber)" />
  <path d="M 308 184 L 340 220" class="flow-indigo" marker-end="url(#arr-indigo)" />

  <!-- Upstream-First Fix propagation -->
  <path d="M 378 134 L 412 168" class="flow-red-dash" marker-end="url(#arr-red)" />
  <path d="M 424 184 L 458 220" class="flow-red-dash" marker-end="url(#arr-red)" />

  <!-- Commits -->
  <circle cx="168" cy="126" r="8" class="c-blue" />
  <circle cx="218" cy="78" r="7.5" class="c-green" />
  <circle cx="258" cy="126" r="8" class="c-blue" />

  <circle cx="302" cy="176" r="8" class="c-amber" />
  <circle cx="348" cy="228" r="8" class="c-indigo" />

  <circle cx="372" cy="126" r="9" class="c-red" />
  <text x="372" y="112" class="mono-sm txt-red">Fix 1차 반영</text>

  <circle cx="418" cy="176" r="8" class="c-amber" style="stroke:#dc2626;" />
  <text x="454" y="166" class="sub-txt txt-red">검증 승격</text>

  <circle cx="466" cy="228" r="8" class="c-indigo" style="stroke:#dc2626;" />
  <rect x="442" y="242" width="48" height="17" class="badge-indigo" style="fill:#4338ca;stroke:none;" />
  <text x="466" y="254" class="tag-txt">운영 배포</text>

  <!-- Right Panel: Key Characteristics -->
  <rect x="564" y="46" width="232" height="224" class="panel-card" />
  <text x="578" y="66" class="panel-title">환경 중심 전략의 핵심</text>

  <rect x="578" y="78" width="204" height="58" class="pill-blue" />
  <text x="680" y="96" class="mono-label txt-blue">환경별 승격 게이트</text>
  <text x="680" y="113" class="sub-txt txt-slate">브랜치가 곧 배포 환경을 가리킴</text>
  <text x="680" y="128" class="sub-txt txt-muted">QA · 승인 후 staging → prod 병합</text>

  <rect x="578" y="144" width="204" height="62" class="pill-red" />
  <text x="680" y="162" class="mono-label txt-red">Regression 원천 차단</text>
  <text x="680" y="179" class="sub-txt txt-slate">prod에만 고치면 다음 배포 때 덮어씀</text>
  <text x="680" y="195" class="sub-txt txt-muted">반드시 main 선반영 후 순차 전파</text>

  <rect x="578" y="214" width="204" height="44" class="pill-note" />
  <text x="680" y="233" class="mono-sm txt-slate">Release Branch형 변형 지원</text>
  <text x="680" y="248" class="sub-txt txt-muted">외부 배포용 버전 브랜치 모델과 호환</text>

  <!-- Divider -->
  <line x1="24" y1="286" x2="796" y2="286" class="divider" />

  <!-- SECTION 2: RELEASE BRANCHING -->
  <text x="26" y="314" class="section-title">2. Release Branching: 다중 버전(LTS) 동시 유지보수와 Cherry-Pick 백포팅</text>
  <rect x="24" y="326" width="772" height="200" class="panel-card" />

  <!-- Tracks inside left region x=148..604 -->
  <line x1="154" y1="368" x2="604" y2="368" class="lane-line" />
  <line x1="154" y1="428" x2="604" y2="428" class="lane-line" />
  <line x1="154" y1="488" x2="604" y2="488" class="lane-line" />

  <!-- Lane Badges -->
  <rect x="38" y="352" width="106" height="32" class="badge-blue" />
  <text x="91" y="366" class="mono-label txt-blue">main</text>
  <text x="91" y="379" class="sub-txt txt-slate">차기 버전 개발</text>

  <rect x="38" y="412" width="106" height="32" class="badge-amber" />
  <text x="91" y="426" class="mono-label txt-amber">release/2.0</text>
  <text x="91" y="439" class="sub-txt txt-slate">현재 지원 버전</text>

  <rect x="38" y="472" width="106" height="32" class="badge-slate" />
  <text x="91" y="486" class="mono-label txt-slate">release/1.0</text>
  <text x="91" y="499" class="sub-txt txt-slate">구버전 LTS 유지</text>

  <!-- main stream -->
  <line x1="176" y1="368" x2="274" y2="368" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="286" y1="368" x2="374" y2="368" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="386" y1="368" x2="474" y2="368" class="flow-blue" marker-end="url(#arr-blue)" />
  <line x1="486" y1="368" x2="568" y2="368" class="flow-blue" marker-end="url(#arr-blue)" />

  <!-- fork release/1.0 from C1 -->
  <path d="M 180 376 L 222 480" class="flow-slate" />
  <line x1="230" y1="488" x2="386" y2="488" class="flow-slate" />
  <line x1="386" y1="488" x2="564" y2="488" class="flow-slate" />

  <!-- fork release/2.0 from C2 -->
  <path d="M 290 376 L 332 422" class="flow-amber" />
  <line x1="340" y1="428" x2="524" y2="428" class="flow-amber" />

  <!-- cherry-pick arrows from B1 (486, 368) -->
  <path d="M 490 376 L 528 420" class="flow-cherry" marker-end="url(#arr-red)" />
  <path d="M 488 378 L 568 478" class="flow-cherry" marker-end="url(#arr-red)" />

  <!-- Commit nodes -->
  <circle cx="176" cy="368" r="8" class="c-blue" />
  <text x="176" y="352" class="mono-sm txt-blue">C1</text>

  <circle cx="286" cy="368" r="8" class="c-blue" />
  <text x="286" y="352" class="mono-sm txt-blue">C2</text>

  <circle cx="386" cy="368" r="8" class="c-blue" />
  <text x="386" y="352" class="mono-sm txt-blue">C3 (신기능)</text>

  <circle cx="486" cy="368" r="9" class="c-red" />
  <text x="486" y="352" class="mono-sm txt-red">B1 (보안 패치)</text>

  <circle cx="580" cy="368" r="8" class="c-blue" />
  <text x="580" y="352" class="mono-sm txt-blue">C4 (신기능)</text>

  <!-- release/2.0 nodes -->
  <circle cx="340" cy="428" r="8" class="c-amber" />
  <rect x="316" y="440" width="48" height="16" class="badge-amber" style="fill:#b45309;stroke:none;" />
  <text x="340" y="451" class="tag-txt">v2.0.0</text>

  <circle cx="536" cy="428" r="8" class="c-red" />
  <rect x="512" y="440" width="48" height="16" class="badge-amber" style="fill:#b45309;stroke:none;" />
  <text x="536" y="451" class="tag-txt">v2.0.1</text>

  <!-- release/1.0 nodes -->
  <circle cx="230" cy="488" r="8" class="c-slate" />
  <rect x="206" y="500" width="48" height="16" class="badge-slate" style="fill:#475569;stroke:none;" />
  <text x="230" y="511" class="tag-txt">v1.0.0</text>

  <circle cx="386" cy="488" r="8" class="c-slate" />
  <rect x="362" y="500" width="48" height="16" class="badge-slate" style="fill:#475569;stroke:none;" />
  <text x="386" y="511" class="tag-txt">v1.0.1</text>

  <circle cx="576" cy="488" r="8" class="c-red" />
  <rect x="552" y="500" width="48" height="16" class="badge-slate" style="fill:#475569;stroke:none;" />
  <text x="576" y="511" class="tag-txt">v1.0.2</text>

  <text x="448" y="410" class="mono-sm txt-red">cherry-pick</text>

  <!-- Right Side Explanation Panel inside Section 2 -->
  <rect x="618" y="340" width="164" height="172" class="pill-amber" />
  <text x="700" y="362" class="mono-label txt-amber">백포팅 핵심 메커니즘</text>
  <text x="700" y="384" class="sub-txt txt-slate">1. main에서 버그 수정(B1)</text>
  <text x="700" y="402" class="sub-txt txt-slate">2. 필요한 릴리즈 브랜치만</text>
  <text x="700" y="418" class="sub-txt txt-red" style="font-weight:700;">git cherry-pick B1</text>
  <text x="700" y="442" class="sub-txt txt-muted">C3 · C4 미출시 기능 유입 없이</text>
  <text x="700" y="458" class="sub-txt txt-muted">구버전 LTS에 패치만 이식</text>
  <rect x="630" y="472" width="140" height="28" class="pill-note" />
  <text x="700" y="490" class="sub-txt txt-slate">적합: SDK · 온프레미스 · OS</text>
</svg>
