<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">전통적 SSH Git 서버 구조와 현대 GitHub Smart HTTPS 권장 아키텍처</title>
  <desc id="diagram-desc">상단은 단일 git OS 계정과 authorized_keys, git-shell을 이용해 SSH 접속자를 격리하고 Bare 저장소에 접근시키는 전통적 서버 구조를, 하단은 포트 443, GCM 및 gh auth, Fine-grained PAT, git-http-backend로 구성된 현대 GitHub Smart HTTPS 아키텍처를 비교한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
      .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; text-anchor: middle; }
      .mono-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-anchor: middle; }
      .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }

      .panel-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; rx: 8; }
      .panel-slate { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .panel-amber { fill: #fefce8; stroke: #d97706; stroke-width: 1.4; rx: 8; }
      .panel-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; }

      .pill-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; rx: 6; }
      .pill-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.2; rx: 6; }
      .pill-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.2; rx: 6; }
      .pill-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; rx: 6; }
      .pill-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 6; }

      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-red { fill: #b91c1c; }

      .arrow-blue { stroke: #0284c7; stroke-width: 1.6; fill: none; }
      .arrow-green { stroke: #16a34a; stroke-width: 1.6; fill: none; }
      .arrow-slate { stroke: #475569; stroke-width: 1.5; fill: none; }
    </style>

    <marker id="head-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="head-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="1" y="1" width="818" height="538" rx="12" class="bg" />

  <!-- SECTION 1: SSH GIT SERVER WITH GIT-SHELL -->
  <text x="26" y="30" class="section-title">1. 전통적 SSH Git 서버 구조: 단일 git 계정과 git-shell 보안 격리 (Pro Git 4.3~4.4)</text>

  <!-- Left: Developers -->
  <rect x="24" y="46" width="186" height="198" class="panel-blue" />
  <text x="117" y="68" class="box-title txt-blue">개발자 (Ed25519 키)</text>

  <rect x="36" y="82" width="162" height="42" class="pill-card" />
  <text x="117" y="99" class="mono-title txt-slate">John (id_ed25519)</text>
  <text x="117" y="114" class="mono-sub txt-blue">git@gitserver:proj.git</text>

  <rect x="36" y="132" width="162" height="42" class="pill-card" />
  <text x="117" y="149" class="mono-title txt-slate">Josie (id_ed25519)</text>
  <text x="117" y="164" class="mono-sub txt-blue">git@gitserver:proj.git</text>

  <rect x="36" y="182" width="162" height="48" class="pill-card" />
  <text x="117" y="200" class="sub-txt txt-slate" style="font-weight: 700;">모두 동일 OS 계정 접속</text>
  <text x="117" y="217" class="sub-txt txt-muted">(커밋 Author는 별개 보존)</text>

  <!-- Arrow Left -> Middle -->
  <line x1="210" y1="145" x2="250" y2="145" class="arrow-blue" marker-end="url(#head-blue)" />
  <text x="232" y="135" class="edge-label txt-blue">Port 22</text>

  <!-- Middle: SSH + git-shell -->
  <rect x="254" y="46" width="268" height="198" class="panel-slate" />
  <text x="388" y="68" class="box-title txt-slate">인증 및 git-shell 격리 계층</text>

  <rect x="268" y="82" width="240" height="46" class="pill-blue" />
  <text x="388" y="99" class="mono-title txt-blue">/home/git/.ssh/authorized_keys</text>
  <text x="388" y="116" class="mono-sub txt-slate">no-port-forwarding, no-pty 제한</text>

  <rect x="268" y="136" width="240" height="48" class="pill-red" />
  <text x="388" y="153" class="mono-title txt-red">셸: /usr/bin/git-shell</text>
  <text x="388" y="170" class="sub-txt txt-red">ssh 직접 로그인 시 대화형 셸 즉시 차단</text>

  <rect x="268" y="192" width="240" height="40" class="pill-green" />
  <text x="388" y="209" class="mono-sub txt-green" style="font-weight: 700;">git-upload-pack / git-receive-pack만 허용</text>
  <text x="388" y="224" class="sub-txt txt-slate">원격 Git 패킷 송수신만 실행</text>

  <!-- Arrow Middle -> Right -->
  <line x1="522" y1="145" x2="554" y2="145" class="arrow-slate" marker-end="url(#head-slate)" />

  <!-- Right: Bare Repo -->
  <rect x="558" y="46" width="238" height="198" class="panel-amber" />
  <text x="677" y="68" class="box-title txt-amber">Bare 저장소 (/srv/git)</text>

  <rect x="572" y="82" width="210" height="48" class="pill-card" />
  <text x="677" y="100" class="mono-title txt-amber">project.git (--bare)</text>
  <text x="677" y="117" class="sub-txt txt-slate">Working Tree 없는 .git 데이터</text>

  <rect x="572" y="138" width="210" height="44" class="pill-amber" />
  <text x="677" y="155" class="mono-title txt-amber">--shared 그룹 권한</text>
  <text x="677" y="171" class="sub-txt txt-slate">팀원 공동 쓰기 시 권한 충돌 방지</text>

  <rect x="572" y="190" width="210" height="42" class="pill-card" />
  <text x="677" y="207" class="sub-txt txt-slate" style="font-weight: 700;">Non-Bare Push 거부 원리</text>
  <text x="677" y="222" class="sub-txt txt-muted">체크아웃된 작업 트리 훼손 방지</text>

  <!-- Divider -->
  <line x1="24" y1="262" x2="796" y2="262" class="divider" />

  <!-- SECTION 2: MODERN GITHUB SMART HTTPS -->
  <text x="26" y="290" class="section-title">2. 현대 GitHub / 엔터프라이즈 Smart HTTPS 아키텍처와 권장 이유 (Port 443)</text>

  <!-- Left: Modern Clients and Auth -->
  <rect x="24" y="308" width="222" height="218" class="panel-blue" />
  <text x="135" y="330" class="box-title txt-blue">현대 클라이언트 인증</text>

  <rect x="38" y="344" width="194" height="50" class="pill-card" />
  <text x="135" y="362" class="mono-title txt-blue">GCM / gh auth login</text>
  <text x="135" y="378" class="sub-txt txt-slate">OAuth 인증 + OS 키체인 저장</text>
  <text x="135" y="389" class="sub-txt txt-muted">매번 토큰 입력 불필요</text>

  <rect x="38" y="402" width="194" height="54" class="pill-green" />
  <text x="135" y="420" class="mono-title txt-green">Fine-grained PAT</text>
  <text x="135" y="436" class="sub-txt txt-slate">특정 Repo · 세밀한 권한 스코프</text>
  <text x="135" y="449" class="sub-txt txt-green">만료일 지정 (Zero Trust)</text>

  <rect x="38" y="464" width="194" height="48" class="pill-amber" />
  <text x="135" y="482" class="mono-title txt-amber">Actions GITHUB_TOKEN</text>
  <text x="135" y="499" class="sub-txt txt-slate">CI/CD 작업 종료 시 자동 만료</text>

  <!-- Arrow Left -> Middle -->
  <line x1="246" y1="416" x2="284" y2="416" class="arrow-green" marker-end="url(#head-green)" />
  <text x="267" y="406" class="edge-label txt-green">443</text>

  <!-- Middle: HTTPS Gateway -->
  <rect x="288" y="308" width="240" height="218" class="panel-green" />
  <text x="408" y="330" class="box-title txt-green">HTTPS 443 · 인가 게이트웨이</text>

  <rect x="302" y="344" width="212" height="48" class="pill-card" />
  <text x="408" y="362" class="sub-txt txt-green" style="font-weight: 700;">방화벽 호환성 (Port 443)</text>
  <text x="408" y="379" class="sub-txt txt-slate">사내·프록시 환경에서도 차단 없음</text>

  <rect x="302" y="400" width="212" height="56" class="pill-card" />
  <text x="408" y="418" class="sub-txt txt-slate" style="font-weight: 700;">엔드포인트별 읽기/쓰기 인가</text>
  <text x="408" y="434" class="mono-sub txt-blue">service=git-upload-pack</text>
  <text x="408" y="448" class="mono-sub txt-red">service=git-receive-pack (인증)</text>

  <rect x="302" y="464" width="212" height="48" class="pill-red" />
  <text x="408" y="481" class="sub-txt txt-red" style="font-weight: 700;">비밀번호 인증 폐기 (2021.08~)</text>
  <text x="408" y="498" class="sub-txt txt-slate">SSH 키 대비 유출 폭발 반경 최소화</text>

  <!-- Arrow Middle -> Right -->
  <line x1="528" y1="416" x2="564" y2="416" class="arrow-green" marker-end="url(#head-green)" />

  <!-- Right: Platform Backend -->
  <rect x="568" y="308" width="228" height="218" class="panel-slate" />
  <text x="682" y="330" class="box-title txt-slate">호스팅 플랫폼 본질 (4.6~4.9)</text>

  <rect x="582" y="346" width="200" height="52" class="pill-green" />
  <text x="682" y="366" class="mono-title txt-green">git-http-backend + Bare</text>
  <text x="682" y="384" class="sub-txt txt-slate">동일한 Git 코어 전송 엔진 동작</text>

  <rect x="582" y="408" width="200" height="52" class="pill-blue" />
  <text x="682" y="427" class="sub-txt txt-blue" style="font-weight: 700;">협업 레이어 (GitHub · GitLab)</text>
  <text x="682" y="445" class="sub-txt txt-slate">PR · 이슈 · 웹 IDE · Actions CI</text>

  <rect x="582" y="470" width="200" height="42" class="pill-card" />
  <text x="682" y="487" class="sub-txt txt-muted" style="font-weight: 700;">레거시 GitWeb · 수동 Apache 대체</text>
  <text x="682" y="502" class="sub-txt txt-slate">인프라 본질은 Bare + Smart HTTP</text>
</svg>
