<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">대화형 리베이스(git rebase -i) 편집 명령과 git filter-repo 이력 정화 비교</title>
  <desc id="diagram-desc">상단은 git rebase -i의 todo 스크립트를 통한 커밋 합치기, 메시지 수정, 삭제, 순서 변경 원리를 보여주고, 하단은 구식 filter-branch 대비 현대 git filter-repo의 성능과 안전성 차이를 비교한다.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .panel-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 8; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }

      .code-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1.2; rx: 7; }
      .pill-blue { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.1; rx: 6; }
      .pill-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.1; rx: 6; }
      .pill-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.1; rx: 6; }
      .pill-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.1; rx: 6; }
      .pill-indigo { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.1; rx: 6; }
      .pill-slate { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 6; }

      .mono-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mono-left { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; text-anchor: start; }
      .code-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #e2e8f0; text-anchor: start; }
      .code-kw { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #38bdf8; text-anchor: start; }
      .code-kw-warn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #fbbf24; text-anchor: start; }
      .code-kw-del { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #f87171; text-anchor: start; }
      .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
      .sub-left { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: start; }

      .txt-blue { fill: #0369a1; }
      .txt-green { fill: #15803d; }
      .txt-amber { fill: #b45309; }
      .txt-red { fill: #b91c1c; }
      .txt-indigo { fill: #4338ca; }
      .txt-slate { fill: #334155; }
      .txt-muted { fill: #64748b; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="818" height="518" rx="12" class="bg" />

  <!-- SECTION 1: INTERACTIVE REBASE -->
  <text x="26" y="34" class="section-title">1. 대화형 리베이스(git rebase -i): 커밋 히스토리 정제 6대 명령어</text>

  <!-- Left Panel: Todo Script Mockup -->
  <rect x="24" y="46" width="356" height="222" class="panel-card" />
  <text x="38" y="66" class="panel-title">A. git rebase -i HEAD~4 편집 스크립트</text>

  <rect x="38" y="76" width="328" height="114" class="code-box" />
  <text x="50" y="96" class="code-kw">pick</text>
  <text x="108" y="96" class="code-txt">a1b2c3d feat: add user table</text>

  <text x="50" y="116" class="code-kw-warn">reword</text>
  <text x="108" y="116" class="code-txt">e4f5a6b add login api</text>

  <text x="50" y="136" class="code-kw-warn">fixup</text>
  <text x="108" y="136" class="code-txt">c7d8e9f WIP fix typo</text>

  <text x="50" y="156" class="code-kw-del">drop</text>
  <text x="108" y="156" class="code-txt">0a1b2c3 debug console.log</text>

  <text x="50" y="177" class="code-txt" style="fill:#94a3b8;"># 위 줄 순서를 바꾸면 커밋 순서도 재배치</text>

  <rect x="38" y="198" width="328" height="58" class="pill-green" />
  <text x="202" y="216" class="mono-label txt-green">재작성 결과: a1b2c3d → e4f5a6b'(로그인+오타포함)</text>
  <text x="202" y="233" class="sub-txt txt-slate">과거부터 최신 순(오래된 커밋이 맨 위)으로 나열됨</text>
  <text x="202" y="247" class="sub-txt txt-muted">(git log 출력 방향과 반대이므로 주의!)</text>

  <!-- Right Panel: Command Grid -->
  <rect x="394" y="46" width="402" height="222" class="panel-card" />
  <text x="408" y="66" class="panel-title">B. 주요 키워드 동작 정리</text>

  <rect x="408" y="78" width="182" height="54" class="pill-blue" />
  <text x="418" y="96" class="mono-left txt-blue">pick (p) · reword (r)</text>
  <text x="418" y="112" class="sub-left txt-slate">p: 커밋 그대로 유지</text>
  <text x="418" y="125" class="sub-left txt-slate">r: 내용 유지 · 메시지만 수정</text>

  <rect x="598" y="78" width="184" height="54" class="pill-amber" />
  <text x="608" y="96" class="mono-left txt-amber">squash (s) · fixup (f)</text>
  <text x="608" y="112" class="sub-left txt-slate">s: 위 커밋에 합치고 메시지 편집</text>
  <text x="608" y="125" class="sub-left txt-slate">f: 위 커밋에 합치고 메시지 버림</text>

  <rect x="408" y="140" width="182" height="54" class="pill-indigo" />
  <text x="418" y="158" class="mono-left txt-indigo">edit (e) · 분할(Split)</text>
  <text x="418" y="174" class="sub-left txt-slate">커밋 적용 후 일시 정지</text>
  <text x="418" y="187" class="sub-left txt-slate">reset HEAD^ 후 여러 커밋 분할</text>

  <rect x="598" y="140" width="184" height="54" class="pill-red" />
  <text x="608" y="158" class="mono-left txt-red">drop (d) · 줄 이동</text>
  <text x="608" y="174" class="sub-left txt-slate">d 또는 줄 삭제: 커밋 영구 제거</text>
  <text x="608" y="187" class="sub-left txt-slate">줄 순서 바꾸기: 커밋 순서 재정렬</text>

  <rect x="408" y="202" width="374" height="54" class="pill-slate" />
  <text x="595" y="221" class="mono-label txt-red">Golden Rule: 공유 원격 브랜치에는 절대 rebase -i 금지</text>
  <text x="595" y="239" class="sub-txt txt-slate">Push 이전 로컬 Topic 브랜치에서만 히스토리를 정제한 뒤 PR 생성</text>

  <!-- Divider -->
  <line x1="24" y1="282" x2="796" y2="282" class="divider" />

  <!-- SECTION 2: FILTER-REPO VS FILTER-BRANCH -->
  <text x="26" y="308" class="section-title">2. 전체 히스토리 영구 정화: 구식 filter-branch 폐기와 현대 표준 git filter-repo</text>

  <!-- Left Panel: Legacy filter-branch -->
  <rect x="24" y="320" width="372" height="184" class="panel-card" />
  <text x="38" y="340" class="panel-title">A. git filter-branch (공식 Deprecated)</text>

  <rect x="38" y="352" width="344" height="50" class="pill-red" />
  <text x="48" y="370" class="mono-left txt-red">모든 커밋마다 쉘 서브프로세스 반복 실행</text>
  <text x="48" y="388" class="sub-left txt-slate">커밋 수만 개 저장소에서는 수 시간 소요 + 쉘 이스케이핑 함정</text>

  <rect x="38" y="410" width="344" height="82" class="pill-slate" />
  <text x="48" y="428" class="mono-left txt-slate">잔여 refs/original 백업 문제</text>
  <text x="48" y="445" class="sub-left txt-slate">실행 후에도 .git/refs/original/에 옛 기록이 남아 용량 폭증</text>
  <text x="48" y="462" class="sub-left txt-slate">Git 공식 문서도 데이터 손실·성능 문제로 사용 중단을 권고함</text>
  <text x="48" y="479" class="sub-left txt-muted">(특수 케이스: --subdirectory-filter 디렉토리 분리 등)</text>

  <!-- Right Panel: Modern filter-repo -->
  <rect x="410" y="320" width="386" height="184" class="panel-card" />
  <text x="424" y="340" class="panel-title">B. git filter-repo (현대 공식 권장 도구)</text>

  <rect x="424" y="352" width="358" height="44" class="pill-green" />
  <text x="434" y="369" class="mono-left txt-green">fast-export / fast-import 스트림 직접 파싱</text>
  <text x="434" y="386" class="sub-left txt-slate">Python 기반 메모리 스트리밍으로 filter-branch 대비 수십~수백 배 고속</text>

  <rect x="424" y="404" width="358" height="44" class="pill-blue" />
  <text x="434" y="421" class="mono-left txt-blue">git filter-repo --path secret.env --invert-paths</text>
  <text x="434" y="438" class="sub-left txt-slate">실수로 커밋한 .env · 대용량 바이너리를 전체 히스토리에서 한 줄로 소거</text>

  <rect x="424" y="454" width="358" height="38" class="pill-amber" />
  <text x="434" y="470" class="mono-left txt-amber">git filter-repo --replace-text expressions.txt</text>
  <text x="434" y="484" class="sub-left txt-slate">유출된 API 키 · 비밀번호 문자열을 전 커밋에 걸쳐 ***로 일괄 마스킹</text>
</svg>
