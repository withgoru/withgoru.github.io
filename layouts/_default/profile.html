{{- define "main" }}
{{- partial "index_profile.html" . }}

{{- if .Content }}
<article class="post-single">
  <div class="post-content">
    {{- if not (.Param "disableAnchoredHeadings") }}
    {{- partial "anchored_headings.html" .Content -}}
    {{- else }}{{ .Content }}{{ end }}
  </div>
</article>

<script>
  (function() {
    var expElem = document.getElementById("work-experience-years");
    if (!expElem) return;

    var startDate = new Date(2016, 2, 2); // 2016-03-02 (월 인덱스는 0부터 시작하므로 2는 3월)
    var today = new Date();

    var years = today.getFullYear() - startDate.getFullYear();
    var monthDiff = today.getMonth() - startDate.getMonth();
    var dayDiff = today.getDate() - startDate.getDate();

    if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
      years--;
    }

    expElem.textContent = years + " yrs";
  })();
</script>
{{- end }}
{{- end }}{{- /* end main */ -}}
